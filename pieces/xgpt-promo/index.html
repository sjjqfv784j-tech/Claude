<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>X.GPT — Motion</title>
<style>
:root{--red:#ff3d47;--red2:#e11d2e;--bg:#07070a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden;font-family:Inter,"Inter Display",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#bg{position:absolute;left:0;top:0}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;perspective:2400px;perspective-origin:50% 45%}
.abs{position:absolute}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .08em .16em;margin:0 -.08em}
.wi{display:inline-block;will-change:transform}
.rg{background:linear-gradient(180deg,#ff6a6e 0%,#ff3d47 45%,#d3172a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kin{position:absolute;white-space:nowrap;font-weight:800;letter-spacing:-.035em;line-height:1.02}
.win{position:absolute;width:1360px;height:805px;border-radius:22px;overflow:hidden;background:#0a0a0d;border:1px solid rgba(255,90,90,.38);box-shadow:0 0 0 1px rgba(0,0,0,.7),0 50px 140px rgba(0,0,0,.75),0 0 140px rgba(255,40,55,.22)}
.bar{height:40px;background:linear-gradient(#1a1a20,#121217);display:flex;align-items:center;padding:0 18px;gap:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.dot{width:12px;height:12px;border-radius:50%}
.url{position:absolute;left:470px;width:420px;height:24px;border-radius:12px;background:#0b0b0e;color:#8d8d98;font-size:13px;text-align:center;line-height:24px;letter-spacing:.02em}
.view{position:relative;width:1360px;height:765px;overflow:hidden;background:#050507}
.L{position:absolute;left:0;top:0;width:3200px;height:1800px;transform-origin:0 0}
.L>img.bgimg{position:absolute;left:0;top:0;width:3200px;height:1800px}
.cur{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;z-index:50}
.cur svg{position:absolute;left:-3px;top:-2px;width:34px;height:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(255,61,71,.55))}
.rip{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:5px solid rgba(255,80,90,.95);box-shadow:0 0 30px rgba(255,60,70,.7),inset 0 0 30px rgba(255,60,70,.4);opacity:0}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.12);backdrop-filter:blur(6px)}
.chip{position:absolute;display:flex;align-items:center;gap:20px;padding:0 38px 0 18px;height:96px;border-radius:48px;font-size:42px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.chip i{font-style:normal;display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#ff5a62,#c4121f);font-size:30px;font-weight:800}
.mchip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:18px;padding:0 38px 0 14px;height:92px;border-radius:46px;font-size:42px;font-weight:700;white-space:nowrap;letter-spacing:-.01em;margin:-46px 0 0 0}
.mchip i{font-style:normal;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;background:linear-gradient(135deg,#ff5a62,#b30f1d)}
.btn{display:flex;align-items:center;justify-content:center;gap:16px;border-radius:20px;background:linear-gradient(180deg,#ff5656,#e11d2e);font-weight:700;box-shadow:0 14px 50px rgba(255,50,60,.45),inset 0 1px 0 rgba(255,255,255,.35)}
#tr{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:40}
#tr .bar2{position:absolute;background:linear-gradient(90deg,#ff4a54,#c4121f);box-shadow:0 0 40px rgba(255,50,60,.7)}
#grain{position:absolute;left:-200px;top:-200px;width:2320px;height:1480px;opacity:.07;mix-blend-mode:overlay;z-index:60;pointer-events:none}
#vig{position:absolute;inset:0;z-index:55;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#flash{position:absolute;inset:0;z-index:58;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff,rgba(255,150,150,.9) 40%,rgba(255,40,50,0) 75%);opacity:0}
pre{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace}
</style></head>
<body><div id="root">
<canvas id="bg" width="1920" height="1080"></canvas>

<!-- S1 -->
<div class="scene" id="s1">
  <div id="s1line" class="abs" style="left:0;top:538px;height:3px;background:linear-gradient(90deg,transparent,#ff3d47,transparent);box-shadow:0 0 30px #ff3d47;width:0"></div>
  <div id="s1head" class="abs" style="left:0;top:0;width:1920px;height:1080px"></div>

</div>
<script>
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eO=x=>1-Math.pow(1-x,3);
const eI=x=>x*x*x;
const eOE=x=>x>=1?1:1-Math.pow(2,-10*x);
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const spring=(t,t0,k=8,w=15)=>{const x=t-t0;return x<0?0:1-Math.exp(-k*x)*Math.cos(w*x)};
function RNG(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function kf(t,a,ease=eIO){if(t<=a[0][0])return a[0][1];for(let i=0;i<a.length-1;i++){if(t<a[i+1][0])return lerp(a[i][1],a[i+1][1],ease(P(t,a[i][0],a[i+1][0])))}return a[a.length-1][1]}
const $=id=>document.getElementById(id);
function el(html,parent){const d=document.createElement('div');d.innerHTML=html;const e=d.firstElementChild;if(parent)parent.appendChild(e);return e}
const CUR_SVG='<svg viewBox="0 0 34 40"><path d="M3 2 L3 29 L10 23 L15 35 L20 33 L15 21 L25 21 Z" fill="#fff" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/></svg>';

// Kinetic text: items [[text,time,cls]]
function Kin(parent,items,style,mode='up'){
  const c=el(`<div class="kin" style="${style}"></div>`,parent);const ws=[];
  items.forEach((it,i)=>{const w=el(`<span class="w"><span class="wi ${it[2]||''}">${it[0]}</span></span>`,c);c.appendChild(document.createTextNode(' '));ws.push({wi:w.firstElementChild,t:it[1]})});
  return {c,upd(t,out=0){ // out: 0..1 exit progress
    ws.forEach((w,i)=>{const p=eO(P(t,w.t,w.t+.6));const o=eI(out);
      w.wi.style.transform=`translateY(${(1-p)*115+o*-110}%)`;w.wi.style.opacity=clamp(p*3)*(1-o)})}};
}

// ---------- background canvas ----------
const bgc=$('bg'),bg=bgc.getContext('2d');
const EMB=[];{const r=RNG(7);for(let i=0;i<120;i++)EMB.push({x:r()*1920,sp:.025+r()*.07,ph:r(),sz:1+r()*3.2,f:.4+r()*1.2,a:.3+r()*.7,hot:r()})}
const BURSTS=[3.86,54.9,59.0,43.0];
function drawBG(t){
  const g=bg;g.globalCompositeOperation='source-over';g.fillStyle='#060608';g.fillRect(0,0,1920,1080);
  const gl=[[960+Math.sin(t*.3)*340,280+Math.cos(t*.23)*130,980,.30],[1560+Math.cos(t*.2)*220,900,820,.17],[300+Math.sin(t*.17)*120,760,700,.12]];
  gl.forEach(([x,y,r,a])=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(225,29,46,${a})`);gr.addColorStop(1,'rgba(225,29,46,0)');g.fillStyle=gr;g.fillRect(0,0,1920,1080)});
  // perspective grid floor
  g.save();g.strokeStyle='rgba(255,61,71,.10)';g.lineWidth=1.5;const vy=560;
  g.beginPath();for(let i=-22;i<=22;i++){g.moveTo(960+i*26,vy);g.lineTo(960+i*190,1080)}g.stroke();
  for(let k=0;k<16;k++){const z=Math.pow((k+((t*.55)%1))/16,2.3);const y=vy+z*520;g.strokeStyle=`rgba(255,61,71,${.02+.11*z})`;g.beginPath();g.moveTo(0,y);g.lineTo(1920,y);g.stroke()}
  g.restore();
  // embers
  g.globalCompositeOperation='lighter';
  EMB.forEach(e=>{const u=((t*e.sp+e.ph)%1);const y=1120-u*1250;const x=e.x+Math.sin(t*e.f+e.ph*9)*38;const tw=.55+.45*Math.sin(t*3+e.ph*40);const a=e.a*tw*Math.min(1,u*5)*Math.min(1,(1-u)*4);
    g.fillStyle=`rgba(255,${80+e.hot*120|0},${60+e.hot*40|0},${a*.10})`;g.beginPath();g.arc(x,y,e.sz*5,0,6.283);g.fill();
    g.fillStyle=`rgba(255,${130+e.hot*110|0},${100+e.hot*80|0},${a*.9})`;g.beginPath();g.arc(x,y,e.sz,0,6.283);g.fill()});
  // bursts
  BURSTS.forEach((tb,bi)=>{const dt=t-tb;if(dt<0||dt>2.2)return;const r=RNG(100+bi);for(let i=0;i<130;i++){const ang=r()*6.283,sp=250+r()*1500,sz=1.5+r()*4;const d=sp*(1-Math.exp(-dt*2.6))/2.6;const a=(1-dt/2.2)*(.4+.6*r());const cx=bi===3?960:960,cy=bi===3?500:520;
    g.fillStyle=`rgba(255,${100+r()*130|0},${80+r()*60|0},${a})`;g.beginPath();g.arc(cx+Math.cos(ang)*d,cy+Math.sin(ang)*d+dt*dt*60,sz*(1-dt/2.6),0,6.283);g.fill()}});
  g.globalCompositeOperation='source-over';
}
// grain tile
{const c=$('grain'),g=c.getContext('2d'),im=g.createImageData(512,512),r=RNG(3);for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}

// ---------- window helper ----------
function mkWin(parent,img,left,top,url){
  const root=el(`<div class="abs" style="left:${left}px;top:${top}px;width:1360px;height:805px;transform-style:preserve-3d"></div>`,parent);
  const glow=el(`<div class="abs" style="left:-160px;top:-100px;width:1680px;height:1000px;background:radial-gradient(ellipse,rgba(255,40,55,.35),rgba(255,40,55,0) 62%);filter:blur(30px);opacity:.8"></div>`,root);
  const win=el(`<div class="win" style="left:0;top:0"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="url">🔒 ${url}</span></div><div class="view"><div class="L"><img class="bgimg" src="assets/${img}"></div></div></div>`,root);
  const L=win.querySelector('.L');
  const sheen=el(`<div class="abs" style="left:0;top:40px;width:1360px;height:765px;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);mix-blend-mode:screen;opacity:0;pointer-events:none;z-index:30"></div>`,win);
  const cur=el(`<div class="cur">${CUR_SVG}<div class="rip"></div><div class="rip"></div></div>`,L);
  const S0=1360/3200;
  return {root,win,L,glow,cur,sheen,
    cam(z,fx,fy){this.z=z;this.k=z*S0;L.style.transform=`translate(${680-fx*3200*this.k}px,${382.5-fy*1800*this.k}px) scale(${this.k})`},
    tilt(rx,ry,sc,tz=0,dx=0,dy=0){root.style.transform=`translate3d(${dx}px,${dy}px,${tz}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc})`},
    // cursor: keyframes of [t,nx,ny] ; clicks list
    cursor(t,path,clicks,vis=[0,1e9]){
      if(t<vis[0]||t>vis[1]){cur.style.display='none';return}cur.style.display='block';
      let x=path[0][1],y=path[0][2];
      for(let i=0;i<path.length-1;i++){if(t>=path[i][0]&&t<path[i+1][0]){const u=eIO(P(t,path[i][0],path[i+1][0]));x=lerp(path[i][1],path[i+1][1],u);y=lerp(path[i][2],path[i+1][2],u)-Math.sin(u*Math.PI)*.018;break}if(t>=path[path.length-1][0]){x=path[path.length-1][1];y=path[path.length-1][2]}}
      let press=1;clicks.forEach(c=>{const d=t-c;if(d>-.04&&d<.2)press=Math.min(press,.82+.18*Math.abs(d-.08)/.12)});
      cur.style.transform=`translate(${x*3200}px,${y*1800}px) scale(${press/this.k})`;
      const rs=cur.querySelectorAll('.rip');rs.forEach((r,i)=>{let o=0,s=0;clicks.forEach(c=>{const p=P(t,c+i*.12,c+i*.12+.6);if(p>0&&p<1){o=Math.max(o,1-p);s=eO(p)}});r.style.opacity=o;r.style.transform=`scale(${.1+s*1.5})`});
    }};
}
// ---------- S1 ----------
const s1k1=Kin($('s1head'),[['Une',.55],['idée',.74],['en',.91],['tête.',1.0]],'left:0;width:1920px;text-align:center;top:290px;font-size:158px');
const s1k2=Kin($('s1head'),[['Tout',1.78,'rg'],['pour',1.94,'rg'],['la',2.08,'rg'],['créer.',2.17,'rg']],'left:0;width:1920px;text-align:center;top:450px;font-size:158px');
const s1letters=[];{const w=$('s1word');[['X',3.35],['.',3.59],['G',3.86],['P',3.92],['T',3.98]].forEach(([c,t])=>{const s=el(`<span style="display:inline-block">${c}</span>`,w);s1letters.push({s,t,c})})}
function S1(t){
  $('s1line').style.width=1920*eO(P(t,.1,.75))+'px';$('s1line').style.left=(1920-1920*eO(P(t,.1,.75)))/2+'px';$('s1line').style.opacity=1-P(t,.9,1.4);
  const ex=P(t,2.75,3.35),exo=eI(ex);
  const hd=$('s1head');hd.style.transform=`scale(${1+exo*.45})`;hd.style.filter=`blur(${exo*26}px)`;hd.style.opacity=1-exo;hd.style.display=ex>=1?'none':'block';
  s1k1.upd(t,0);s1k2.upd(t,0);
  const lp=spring(t,2.96,7,12);const lw=$('s1logoW');
  const shake=t>3.86&&t<4.5?Math.sin(t*90)*14*Math.exp(-(t-3.86)*7):0;
  lw.style.opacity=clamp((t-2.96)*5);lw.style.transform=`translate(${shake}px,${shake*.6}px) scale(${.12+.88*lp}) rotate(${(1-lp)*-40}deg)`;
  $('s1logo').style.filter=`drop-shadow(0 0 ${60+120*Math.exp(-Math.max(0,t-3.86)*3)*(t>3.86)}px rgba(255,40,50,.7))`;
  s1letters.forEach(l=>{const p=spring(t,l.t,10,14);const q=P(t,l.t,l.t+.12);l.s.style.opacity=q;l.s.style.transform=`translateY(${(1-p)*-90}px) scale(${1+(1-p)*1.6})`;l.s.style.color=(l.c==='.')?'#ff3d47':'#fff';l.s.style.textShadow=l.c==='.'?'0 0 40px #ff3d47':'0 0 50px rgba(255,60,70,.35)'});
  $('s1word').style.transform=`translate(${shake*.5}px,0)`;
  $('s1sub').style.opacity=eO(P(t,4.6,5.2));$('s1sub').style.transform=`translateY(${(1-eO(P(t,4.6,5.2)))*30}px)`;
  // shockwave rings
  let rings='';[3.86,3.92].forEach((tb,i)=>{const p=P(t,tb,tb+1.2);if(p>0&&p<1){const r=eO(p)*(1500+i*400);rings+=`<div class="abs" style="left:${960-r}px;top:${310-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;border:${8*(1-p)+1}px solid rgba(255,${80+i*60},90,${(1-p)*.9});box-shadow:0 0 60px rgba(255,50,60,${(1-p)*.6})"></div>`}});
  $('s1rings')||el('<div id="s1rings"></div>',$('s1'));$('s1rings').innerHTML=rings;
  fl=Math.max(fl,t>3.86&&t<4.3?Math.exp(-(t-3.86)*9)*.85:0);
}
// ---------- S2 ----------
const W2=mkWin($('w2'),'home.png',280,60,'xsearcher.cc');
const s2sweep=el('<div class="abs" style="left:0;top:0;width:3200px;height:1800px;pointer-events:none"></div>',W2.L);
const s2btn=el('<div class="abs" style="left:1144px;top:1170px;width:454px;height:106px;border-radius:22px;box-shadow:0 0 0 0 rgba(255,80,90,0)"></div>',W2.L);
const S2CH=[['?','Une question',8.68],['&lt;/&gt;','Un script',9.58],['✦','Une image',10.4]];
const s2chips=S2CH.map(([i,tx,t0],k)=>({e:el(`<div class="chip glass" style="left:${[330,810,1250][k]}px;top:925px"><i>${i}</i>${tx}</div>`,$('s2chips')),t0}));
function S2(t){
  const a=P(t,6.0,7.5);
  W2.tilt(lerp(16,0,eO(a)),lerp(-18,0,eO(a)),lerp(.82,1,eO(a)),0,0,lerp(60,0,eO(a)));
  W2.cam(kf(t,[[6,1],[7,1],[8.2,1.32],[9.6,1.32],[11.0,1.7],[12.4,2.0]]),kf(t,[[6,.5],[8.2,.5],[9.6,.5],[11,.43],[12.4,.43]]),kf(t,[[6,.5],[7,.5],[8.2,.40],[9.6,.45],[11,.6],[12.4,.62]]));
  W2.glow.style.opacity=.55+.3*Math.sin(t*2);
  const sp=P(t,6.3,7.6);W2.sheen.style.opacity=sp>0&&sp<1?1:0;W2.sheen.style.transform=`translateX(${lerp(-1500,1500,sp)}px)`;
  // headline underline sweep
  const us=P(t,7.7,8.7);s2sweep.innerHTML=us>0&&us<1?`<div class="abs" style="left:${870}px;top:${900}px;width:${1460*eO(us)}px;height:10px;background:linear-gradient(90deg,#ff3d47,#fff);box-shadow:0 0 50px #ff3d47;opacity:${1-us*us}"></div>`:'';
  const hv=P(t,10.9,11.4);const press=t>11.35&&t<11.55?.95:1;
  s2btn.style.boxShadow=`0 0 ${90*hv}px ${24*hv}px rgba(255,80,90,${.55*hv})`;s2btn.style.transform=`scale(${press})`;
  W2.cursor(t,[[8.9,1.03,.98],[10.1,.72,.86],[11.15,.428,.678],[12.4,.428,.678]],[11.35],[8.9,12.4]);
  s2chips.forEach((c,k)=>{const p=spring(t,c.t0,9,16);const ex=eI(P(t,11.5,12.2));c.e.style.opacity=clamp((t-c.t0)*8)*(1-ex);c.e.style.transform=`translateY(${(1-p)*90+ex*80}px) scale(${.5+.5*p})`;c.e.style.boxShadow=`0 0 ${70*Math.exp(-(t-c.t0)*3)*(t>c.t0)}px rgba(255,61,71,.8)`});
}
// ---------- S3 ----------
const W3=mkWin($('w3'),'gpt_clean.png',280,60,'xsearcher.cc/chatt');
const L3=W3.L;
const PROMPT='Un script pour mon bot Discord ?';
