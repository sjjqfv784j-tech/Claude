// ---------------------------------------------------------------------

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

function RNG(...xs) {

    f,
    r: (a, b) => a + (b - a) * f(),
    n: (amt) => (f() * 2 - 1) * amt,
    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],
  };
}

function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {

    P.push([cx + x * c - y * s, cy + x * s + y * c]);

}

  for (const [cx, cy, a0] of cs) for (let i = 0; i <= n; i++) { const a = a0 + (Math.PI / 2) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }

}

// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);
  const out = new Array(n); let s = 0;
  for (let i = 0; i < n; i++) {
    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;

    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }

  const sway = (o.hop != null ? [].concat(o.hop).reduce((a, hp) => a + kick(t, hp + 0.3, { k: 120, damp: 0.25 }), 0) : 0) * s * 0.18;
  const base = [x, y, zb + hb], tip = [x + sway * 0.7, y + sway * 0.7, zb + hb + s * 0.34];

  const fx = o.faceX, fp = fx ? faceOf([x + wb / 2, y - wb / 2, zb + hb], [0, 1, 0], [0, 0, -1]) : faceOf([x - wb / 2, y + wb / 2, zb + hb], [1, 0, 0], [0, 0, -1]);
  const blink = mod(F + key.length * 13, 62) < 3 || (o.hop != null && [].concat(o.hop).some((hp) => t > hp + 0.3 && t < hp + 0.42));
  const look = (o.look ?? 0) * s * 0.06, ey = hb * 0.46;
  for (const ex of [0.34, 0.66]) faceEll(fp, ex * wb + look, ey, s * 0.062, blink ? s * 0.012 : s * 0.085, { fill: PAL.accent, n: 18 });
  faceLine(fp, [[wb * 0.4 + look, hb * 0.72], [wb * 0.6 + look, hb * 0.72]], PAL.inner);   // a mouth line, light
  // two vent lines on the other side face
  const sp = fx ? faceOf([x - wb / 2, y + wb / 2, zb + hb], [1, 0, 0], [0, 0, -1]) : faceOf([x + wb / 2, y - wb / 2, zb + hb], [0, 1, 0], [0, 0, -1]);
  for (const v of [0.42, 0.56]) faceLine(sp, [[wb * 0.3, hb * v], [wb * 0.7, hb * v]], PAL.inner);
  SPARK_AT = toScreen(...isoP([x, y, zb + hb * 0.5]));
  return { top: zb + hb, body };
}

// ---------------------------------------------------------------------
//  captions and tags (DEFER: drawn after the camera, at screen size)
// ---------------------------------------------------------------------
function isoCaptionNow(str, y, o = {}) {
  const a = spring(TT, E0 + (o.at ?? 0.45), { k: 120, damp: 0.8 }), sz = o.size ?? 46;
  if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha = clamp(a);
  ctx.font = `400 ${sz}px ${SANS}`; ctx.fillStyle = PAL.text; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, CX, y + (1 - a) * 18);
  const w = ctx.measureText(str).width;
  polyPath([[CX - 22, y - sz * 1.25], [CX + 22, y - sz * 1.25]], false); hair(PAL.edge); ctx.stroke();   // a short rule above
  ctx.restore();
  return w;
}
function isoTagNow(num, label) {
  const a = clamp(spring(TT, E0 + 0.15, { k: 140, damp: 0.85 }));
  if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `400 30px ${ISOMONO}`; ctx.fillStyle = PAL.textD; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(num, 70, 318); const w = ctx.measureText(num).width;
  polyPath([[70 + w + 16, 308], [70 + w + 16 + 60 * a, 308]], false); hair(PAL.edge); ctx.stroke();
  ctx.fillStyle = PAL.text; ctx.fillText(label, 70 + w + 92, 318);
  ctx.restore();
}
const isoCaption = (str, o = {}) => { const f = () => isoCaptionNow(str, o.y ?? 1460, o); if (DEFER) DEFER.push(f); else f(); };
const isoTag = (num, label) => { const f = () => isoTagNow(num, label); if (DEFER) DEFER.push(f); else f(); };

// =====================================================================
//  STYLE — the renderer's hooks (see the skill's styles/README.md)
// =====================================================================
const colLum = (c) => { const m = String(c).match(/\d+/g); const v = c[0] === '#' ? [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)) : m.slice(0, 3).map(Number); return (0.299 * v[0] + 0.587 * v[1] + 0.114 * v[2]) / 255; };
const thickDrop = (P, t = 10) => P.map(([x, y]) => [x, y + t]);   // a slab's thickness seen from 30 deg above
const STYLE = {
  name: 'isometric',
  paper: PAL.paper,
  backdrop(c) { fillAll(c); },
  window(P, key, src) {   // src seen through outline P, drawn as a slab: a light thickness line under a hairline rim
    polyPath(thickDrop(P), true); hair(PAL.inner); ctx.stroke();
    ctx.save(); polyPath(P, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    polyPath(P, true); hair(PAL.edge); ctx.stroke();
  },
  blob(P, c, key) {   // the morphing shape: a hairline slab; the fill follows the stroke from accent-dark to face-white
    const la = colLum(PAL.accent), le = colLum(PAL.edge), u = clamp((colLum(c) - la) / (le - la || 1));
    polyPath(thickDrop(P), true); ctx.fillStyle = PAL.face; ctx.fill(); hair(PAL.inner); ctx.stroke();
    polyPath(P, true); ctx.fillStyle = mixHex(PAL.accent, PAL.face, clamp(u * 2.5)); ctx.fill();
    hair(c); ctx.stroke();
  },
  hero(x, y, r, o = {}) { const keep = ISO; setIso({ ox: x, oy: y, u: r / 60 }); cubeBot(0, 0, -0.42 * 60, 60, { key: o.key }); ISO = keep; },
  heroColor: PAL.edge,
  heroPts(x, y, r, n = 96) {   // the cube's silhouette, for hero-to-hero bridges
    const keep = ISO; setIso({ ox: x, oy: y, u: r / 60 }); const s = 60, z0 = -0.42 * s;
    const P = [];
    for (const [px, py] of rrectPts(-s / 2, -s / 2, s, s, s * 0.24, 4)) { P.push(iso(px, py, z0)); P.push(iso(px, py, z0 + s * 0.84)); }
    ISO = keep; return hull2(P);
  },
  post() {},
  ones: true,
};
// =====================================================================
//  SCÈNES — OmniRoute. Chaque scène fixe son origine iso puis dessine de l'arrière vers l'avant.
//  TT = temps absolu ; lt() = temps local à la scène (0 au début de la scène). Tout bouge sur des ressorts.
//  Contenu gardé dans x 60-940, y 250-1500.
// =====================================================================
const OMNI_ISO = { ox: 500, oy: 1000, u: 1.1 };
const lt = () => TT - E0;
const sp = (t0, o = { k: 140, damp: 0.7 }) => spring(lt(), t0, o);   // ressort local
const drop = (t0, h = 220) => (1 - spring(lt(), t0, { k: 160, damp: 0.6 })) * h;
// instant absolu du dernier saut déjà passé parmi les instants locaux donnés
const hopAt = (...ts) => { let h = null; ts.forEach((t) => { if (lt() >= t) h = t; }); return h === null ? 1e9 : E0 + h; };
const typedN = (s, t0, cps = 22) => Math.floor(clamp((lt() - t0) * cps, 0, s.length));

// ---- éléments communs --------------------------------------------------
const PROV = [
  { x: -240, y: -220, name: 'IA 1' },
  { x: -80,  y: -220, name: 'IA 2' },
  { x: 80,   y: -220, name: 'IA 3' },
];
const PW = 160, PD = 96, PH = 24;

// un fournisseur d'IA : une dalle avec un nom et une lampe. state : 'ok' | 'dead'
function provider(p, z0, state, t0 = 0, label) {
  const z = z0 + drop(t0, 180);
  isoBox(p.x, p.y, z, PW, PD, PH, { r: 12, seg: 4 });
  const fp = faceOf([p.x, p.y + PD, z + PH], [1, 0, 0], [0, 0, -1]);
  lamp(fp, 22, PH / 2, 5, state === 'ok' && blinkOn(TT, 1.0, p.x * 0.003));
  isoText(fp, label || p.name, 40, PH / 2 + 6, 18, { color: state === 'dead' ? PAL.textD : PAL.text });
  const top = faceOf([p.x, p.y, z + PH], [1, 0, 0], [0, 1, 0]);
  for (let k = 0; k < 5; k++) faceRR(top, 18 + k * 26, 16, 16, 7, 3, { seg: 2 });
  return fp;
}

// la plaque-passerelle au centre, sur laquelle vit le robot
const HUB = { x: -150, y: -90, w: 300, d: 190 };
function hub(t0 = 0) {
  const dz = (i) => (1 - spring(lt(), t0 + i * 0.08, { k: 160, damp: 0.6 })) * 200;
  isoPlates(HUB.x, HUB.y, 0, HUB.w, HUB.d, [{ h: 14, r: 40, dz: dz(0) }, { h: 12, gap: 6, inset: 12, r: 34, dz: dz(1) - dz(0) }]);
  return 26;   // hauteur du dessus
}

// un câble du hub vers un fournisseur (dessiné en partie : f = 0..1)
function cableTo(p, hz, f) {
  if (f <= 0.02) return;
  const a = [HUB.x + HUB.w / 2 + (p.x + PW / 2 - (HUB.x + HUB.w / 2)) * 0.15, HUB.y, hz];
  const b = [p.x + PW / 2, p.y + PD, 18];
  const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 8];
  const P = [a, m, b].map((q, i, arr) => (i === 0 ? q : [arr[0][0] + (q[0] - arr[0][0]) * f, arr[0][1] + (q[1] - arr[0][1]) * f, q[2]]));
  isoCable(P, { w: 6 });
}

// un terminal posé à plat (dalle + écran) ; renvoie la face du dessus pour y écrire
function terminal(x, y, z, w, d, t0 = 0) {
  const zz = z + drop(t0, 200);
  isoBox(x, y, zz, w, d, 22, { r: 16, seg: 4 });
  const fp = faceOf([x, y, zz + 22], [1, 0, 0], [0, 1, 0]);
  faceRR(fp, 10, 10, w - 20, d - 20, 10);
  for (let i = 0; i < 3; i++) faceEll(fp, 24 + i * 13, 24, 4, 4, { stroke: PAL.inner });
  return fp;
}

  const T = TIMELINE, H = T.cues.hit, S0 = SC, QUIET0 = VL('l7').t1 + 0.1;

  for (let i = 0; i < 20; i++) blip(S0[2] + 0.8 + i * 0.07, 3000, 2600, 0.01, 0.016);          // npm i -g omniroute
  for (let i = 0; i < 10; i++) blip(S0[2] + 3.0 + i * 0.06, 3000, 2600, 0.01, 0.016);          // omniroute
  for (let i = 0; i < 26; i++) blip(S0[6] + 0.9 + i * 0.065, 3000, 2600, 0.01, 0.016);         // omniroute configure claude
  for (let i = 0; i < 4; i++) blip(S0[1] + 1.3 + i * 0.35, 700 + i * 140, 600, 0.04, 0.03);    // câbles qui se branchent
  blip(S0[0] + 3.3, 500, 260, 0.2, 0.05);                                                      // le quota tombe
  [0, 1, 2].forEach((i) => blip(S0[5] + 0.8 + i * 1.3, 1200 + i * 260, 1500 + i * 260, 0.06, 0.04)); // trois champs
  noiseHit(S0[4] + 0.95, 0.3, 'bandpass', 1800, 1.4, 0.03, 0, 0.2, 3200);                      // la clé qui tombe
  noiseHit(H, 1.0, 'lowpass', 220, 1.0, 0.3, 0, 0.5, 400);                                    // le coup : le plus fort
  [0, 1, 2, 3].forEach((i) => blip(H + 2.0 + i * 0.6, 900 + i * 220, 1100 + i * 220, 0.05, 0.03));  // les 4 niveaux
  // =====================================================================
  //  kit/score-tail.js — render, fold the tail over the loop point, loudness stage
  //  (RMS-normalise to -17 dBFS, look-ahead limiter at -1 dBFS; stems share the mix gain curve)
  // =====================================================================
  const buf = await ac.startRendering();

  // loudness for a phone (subagents-short): RMS-normalise to -17 dBFS, then a look-ahead limiter at -1 dBFS.
  // Stems reuse the mix's gain and gain curve, so they sum back to the mix.
  let k = normIn?.k, g = normIn?.g;
