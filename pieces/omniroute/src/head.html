<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniRoute en 1 minute</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6e6ea; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  OMNIROUTE EN 1 MINUTE — 9:16, 60 s @ 24 fps, isométrique clair. Format F4 (mission) piloté par la voix :
//  le développeur perd son IA (quota atteint) -> le petit robot-passerelle branche tout sur une adresse ->
//  4 étapes (installer, fournisseur, clé, client) -> silence -> une panne, le trafic bascule tout seul.
//  Couleur : l'accent sombre = la requête (le curseur / le jeton). Une seule chose sombre par image.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = Math.ceil(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;

// la voix est l'horloge : chaque scène démarre 0,3 s avant sa phrase ; le coup de la bascule tombe dans le silence avant « OmniRoute bascule »
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const LINE_OF_SCENE = ['l1', 'l2', 'l3', 'l4', 'l5', 'l6', 'l6b', 'l7'];
const HIT_T = VL('l8').t0 - 0.6;
const SC = [0, ...LINE_OF_SCENE.slice(1).map((id) => +(VL(id).t0 - 0.3).toFixed(3)), +HIT_T.toFixed(3), +(VL('l9').t0 - 0.3).toFixed(3), DURATION];
const sceneFns = [() => sceneQuota(), () => sceneGateway(), () => sceneInstall(), () => sceneProviders(), () => sceneKey(),
                  () => sceneClient(), () => sceneClaude(), () => sceneSilence(), () => sceneFallback(), () => sceneEnd()];
const ERA_LIST = sceneFns.map((fn, i) => [SC[i], SC[i + 1], fn]);
const SHOT_TITLES = [
  "l'IA atteint sa limite : un fournisseur devient gris", 'le robot branche tous les fournisseurs sur une seule prise',
  'un terminal tape npm i -g omniroute', 'le tableau de bord : on ajoute un fournisseur', 'une clé tombe sur la plaque Endpoints',
  'trois champs : adresse, clé, modèle auto', 'omniroute configure claude', 'silence : un fournisseur s’éteint',
  'la requête bascule sur les 4 niveaux de repli', 'retour au début : le curseur n’a pas été interrompu'];
const SHOT_KEYS = ['quota', 'gateway', 'install', 'providers', 'key', 'client', 'claude', 'silence', 'fallback', 'end'];
const SHOTS = SHOT_KEYS.map((key, i) => ({ id: i + 1, key, era: i, t0: SC[i], t1: SC[i + 1], title: SHOT_TITLES[i] }));

const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'voice-led',
  shots: SHOTS,
  cuts: SC.slice(1, -1),
  morphs: [],
  cues: { hit: HIT_T },
  acts: [
    { name: '1 Problème',   role: 'build',   t0: SC[0], t1: SC[2] },
    { name: '2 Les étapes', role: 'journey', t0: SC[2], t1: SC[7] },
    { name: '3 Silence',    role: 'silence', t0: SC[7], t1: SC[8] },
    { name: '4 Bascule',    role: 'gift',    t0: SC[8], t1: SC[9] },
    { name: '5 Retour',     role: 'goodbye', t0: SC[9], t1: DURATION },
  ],
  board: SHOT_KEYS.map((k, i) => ({ t: +(SC[i] + (SC[i + 1] - SC[i]) * 0.8).toFixed(2), title: SHOT_TITLES[i], sound: i === 8 ? 'le coup le plus fort' : i === 7 ? 'silence' : 'nappe douce, petits clics', next: SHOT_KEYS[i + 1] || 'boucle' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
