<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude ou Claude Code ?</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2118; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  CLAUDE OU CLAUDE CODE ? — 9:16, ~46 s @ 24 fps, crosshatch, voix off. Héros fixe : Pixel, le point d'encre.
//  Idée : Claude te conseille (au téléphone), Claude Code travaille sur ton ordinateur.
//  Faits : doc officielle code.claude.com/docs/en/overview. Vidéo non officielle, non affiliée à Anthropic.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = Math.ceil(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';
const CX = 470;
const TITLE = 'Claude ou Claude Code ?';
const VL = (id) => VOICE.lines.find((l) => l.id === id);
// instant (s) d'un point situé à la fraction f de la ligne id
const VF = (id, f) => { const l = VL(id); return +(l.t0 + (l.t1 - l.t0) * f).toFixed(3); };
// les coupes tombent sur la grille des croches (0,25 s = 6 images) la plus proche de « début de phrase − 0,3 s » : la voix reste l'horloge à ±0,125 s
const snap8 = (t) => Math.round(t / E8) * E8;
const SC = [0, ...['l2', 'l3', 'l3b', 'l3c', 'l4', 'l5', 'l6', 'l7'].map((id) => +snap8(VL(id).t0 - 0.3).toFixed(3)), DURATION];
const HIT_T = +(snap8(VL('l5').t0 - 0.3) + 0.05).toFixed(3);   // le coup tombe juste après la coupe, dans la pause avant la phrase de la règle
const sceneFns = [() => sceneHook(), () => sceneTalk(), () => sceneAgent(), () => sceneWhere(), () => sceneExample(), () => sceneFriend(), () => sceneRule(), () => scenePrice(), () => sceneAsk()];
const ERA_LIST = sceneFns.map((fn, i) => [SC[i], SC[i + 1], fn]);
const SHOT_KEYS = ['hook', 'talk', 'agent', 'where', 'example', 'friend', 'rule', 'price', 'ask'];
const SHOT_TITLES = ['copier, coller, recopier… le mauvais Claude ?', 'Claude : une conversation, puis c’est toi qui fais', 'Claude Code : dans le projet, Read / Edit / Bash', 'quatre endroits : terminal, éditeur, app de bureau, navigateur', 'exemple : une faute corrigée dans le fichier',
  'le téléphone (Claude) et l’ordinateur (Claude Code)', 'la règle : idée → Claude, projet → Claude Code', 'abonnement payant ou compte Console', 'A ou B ? et retour à la page de départ'];
const SHOTS = SHOT_KEYS.map((key, i) => ({ id: i + 1, key, era: i, t0: SC[i], t1: SC[i + 1], title: SHOT_TITLES[i] }));

const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'voice-led',
  shots: SHOTS,
  cuts: SC.slice(1, -1),
  morphs: [],
  cues: { hit: HIT_T },
  acts: [
    { name: '1 Accroche',  role: 'build',   t0: SC[0], t1: SC[2] },
    { name: '2 Les deux',  role: 'journey', t0: SC[2], t1: SC[6] },
    { name: '3 La règle',  role: 'gift',    t0: SC[6], t1: SC[7] },
    { name: '4 Attention', role: 'journey', t0: SC[7], t1: SC[8] },
    { name: '5 Question',  role: 'goodbye', t0: SC[8], t1: DURATION },
  ],
  board: SHOT_KEYS.map((k, i) => ({ t: +(SC[i] + (SC[i + 1] - SC[i]) * 0.8).toFixed(2), title: SHOT_TITLES[i], sound: i === 6 ? 'le coup : la règle' : 'nappe douce, crayon', next: SHOT_KEYS[i + 1] || 'boucle' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
