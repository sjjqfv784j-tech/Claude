<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Bot, c'est quoi ?</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0d22; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// GROK BOT — 9:16, voice-led hard cuts, 24fps. The voice is the clock: each shot starts on a line (snapped to the 8th grid).
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = typeof VOICE !== 'undefined' ? Math.ceil(VOICE.duration * 4) / 4 : 34.75;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Poppins","Montserrat","Nunito Sans","DejaVu Sans","Liberation Sans","Helvetica Neue",Arial,sans-serif';
const CX = 540;
// who speaks each line: C = Claude, G = Grok Bot
const SPK = { l1: 'C', l2: 'G', l3: 'C', l4: 'G', l5: 'C', l6: 'G', l7: 'C', l8: 'G', l9: 'G', l10: 'C', l11: 'G', l12: 'C', l13: 'G' };
const VL = (id) => (typeof VOICE !== 'undefined' ? VOICE.lines.find((l) => l.id === id) : null);
const snap8 = (t) => Math.round(t * 4) / 4;
// VW(id, word, n): start of the n-th spoken word that matches `word` (accents and case ignored); null without a voice
const nrm = (w) => w.normalize('NFD').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
function VW(id, word, n = 1) { const l = VL(id); if (!l) return null; let k = 0; for (const w of l.words) if (nrm(w.w) === nrm(word) && ++k === n) return w.t0; return null; }
const cue = (id, word, dflt, n = 1) => { const t = VW(id, word, n); return t == null ? dflt : t; };
// a beat starts 0.3s after the previous line ends, on the 8th grid; the "Non, lui agit" beat cuts on the word "il"
const after = (prev, dflt) => { const l = VL(prev); return l ? snap8(l.t1 + 0.3) : dflt; };
const talking = (who) => { const l = typeof VOICE !== 'undefined' ? VOICE.lines.find((x) => TT >= x.t0 - 0.02 && TT < x.t1) : null; return !!l && SPK[l.id] === who; };
const spoke = (id) => { const l = VL(id); return !!l && TT >= l.t0 && TT < l.t1; };

// shots: [t0, scene]
const SHOT_LIST = [
  [0, 'room1'],
  [after('l1', 3.0), 'enter'],
  [after('l2', 5.75), 'duo'],
  [snap8(cue('l4', 'il', 8.75)), 'tools'],
  [after('l4', 11.25), 'cloud'],
  [after('l6', 17.0), 'cards'],
  [after('l8', 22.75), 'parallel'],
  [after('l9', 26.5), 'night'],
  [after('l11', 30.5), 'end'],
];
const SCENE = { room1: () => sceneRoom1(), enter: () => sceneEnter(), duo: () => sceneDuo(), tools: () => sceneTools(), cloud: () => sceneCloud(), cards: () => sceneCards(), parallel: () => sceneParallel(), night: () => sceneNight(), end: () => sceneEnd() };
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, SCENE[sc]]);
const SHOTS = SHOT_LIST.map(([t0, sc], i) => [sc, i, t0, ERA_LIST[i][1], sc]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'catalogue',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  morphs: [],
  cues: {},
  acts: [
    { name: '1 La question', role: 'build', t0: 0, t1: SHOT_LIST[3][0] },
    { name: '2 Les outils', role: 'journey', t0: SHOT_LIST[3][0], t1: SHOT_LIST[6][0] },
    { name: '3 L\'equipe', role: 'peak', t0: SHOT_LIST[6][0], t1: SHOT_LIST[7][0] },
    { name: '4 La nuit', role: 'silence', t0: SHOT_LIST[7][0], t1: SHOT_LIST[8][0] },
    { name: '5 La chute', role: 'gift', t0: SHOT_LIST[8][0], t1: DURATION },
  ],
  board: [
    { t: 1.4, title: 'Claude pose la question', sound: 'pad doux, silence avant la reponse', next: 'Grok Bot entre' },
    { t: SHOT_LIST[1][0] + 1.2, title: 'Grok Bot entre: un collegue IA', sound: 'pas de pixel, petit tic', next: 'comme n\'importe quelle IA ?' },
    { t: SHOT_LIST[2][0] + 1.3, title: 'Non, lui agit', sound: 'tic sur la coupe', next: 'le tableau: ses outils' },
    { t: SHOT_LIST[3][0] + 1.5, title: 'mail + agenda + AGENT', sound: 'un tic par icone', next: 'le cloud' },
    { t: SHOT_LIST[4][0] + 4.0, title: 'son ordinateur dans le cloud, 24h/24', sound: 'pad plus ouvert', next: 'ce qu\'il sait faire' },
    { t: SHOT_LIST[5][0] + 4.9, title: 'support client + gestion de comptes', sound: 'tic par carte', next: 'plusieurs en parallele' },
    { t: SHOT_LIST[6][0] + 3.0, title: '1 a 4 ecrans en parallele', sound: 'montee, un tic par ecran', next: 'la nuit' },
    { t: SHOT_LIST[7][0] + 3.2, title: 'la nuit: il demande ton accord', sound: 'presque silence', next: 'la chute' },
    { t: SHOT_LIST[8][0] + 3.0, title: 'la chute: enregistre la video', sound: 'le coup le plus fort, REC', next: 'fin' },
  ],
  narration: typeof VOICE !== 'undefined' ? VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })) : [],
};
window.TIMELINE = TIMELINE;
