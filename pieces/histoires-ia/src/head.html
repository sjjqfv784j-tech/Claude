<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histoires d'IA — présentation de la chaîne</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2118; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  HISTOIRES D'IA — présentation de la chaîne. 9:16, ~55 s @ 24 fps, crosshatch (encre hachurée), voix off.
//  Format « héros fixe » : le point d'encre terracotta traverse les mondes (page blanche, bureau, monde sombre
//  de l'IA…) ; la voix est l'horloge, les coupes tombent sur les fins de phrase.
//  Couleur : terracotta = le héros ; rouge = ce qu'on barre (le jargon) ; vert = ce qui marche.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = Math.ceil(VOICE.duration * FPS) / FPS;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';
const CX = 470;
const NAME = "Histoires d'IA";   // le nom de la chaîne : un seul endroit à changer (et la voix : voice/script.json, ligne l2)

// la voix est l'horloge : chaque scène démarre 0,3 s avant sa phrase ; le coup du titre tombe dans la pause avant « Et tout ça commence maintenant »
const VL = (id) => VOICE.lines.find((l) => l.id === id);
const HIT_T = +(VL('l6').t0 - 0.6).toFixed(3);
const SC = [0, ...['l2', 'l2b', 'l3', 'l4', 'l5', 'l5b'].map((id) => +(VL(id).t0 - 0.3).toFixed(3)),
            +(VL('l5b').t1 + 0.3).toFixed(3), HIT_T, +(VL('l7').t0 - 0.3).toFixed(3), DURATION];
const sceneFns = [() => sceneHook(), () => sceneWho(), () => sceneRules(), () => sceneOne(), () => sceneTwo(),
                  () => sceneThree(), () => sceneThreeB(), () => sceneSilence(), () => scenePayoff(), () => sceneCta()];
const ERA_LIST = sceneFns.map((fn, i) => [SC[i], SC[i + 1], fn]);
const SHOT_KEYS = ['hook', 'who', 'rules', 'one', 'two', 'three', 'threeb', 'silence', 'payoff', 'cta'];
const SHOT_TITLES = ['la page blanche : un point d’encre ouvre les yeux', 'le point à son bureau : le nom de la chaîne',
  'le jargon et les cours barbants sont barrés', 'un robot dessiné : ? puis !', 'un téléphone et une ampoule qui s’allume',
  'des pages empilées : 1/5, 2/5…', 'une histoire qui reste en tête', 'silence : la page est pleine de dessins',
  'le titre s’encre sur la page', 'retour à la page blanche, maintenant signée'];
const SHOTS = SHOT_KEYS.map((key, i) => ({ id: i + 1, key, era: i, t0: SC[i], t1: SC[i + 1], title: SHOT_TITLES[i] }));

const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'voice-led',
  shots: SHOTS,
  cuts: SC.slice(1, -1),
  morphs: [],
  cues: { hit: HIT_T },
  acts: [
    { name: '1 Accroche',   role: 'build',   t0: SC[0], t1: SC[3] },
    { name: '2 Promesses',  role: 'journey', t0: SC[3], t1: SC[7] },
    { name: '3 Silence',    role: 'silence', t0: SC[7], t1: SC[8] },
    { name: '4 Le titre',   role: 'gift',    t0: SC[8], t1: SC[9] },
    { name: '5 Abonne-toi', role: 'goodbye', t0: SC[9], t1: DURATION },
  ],
  board: SHOT_KEYS.map((k, i) => ({ t: +(SC[i] + (SC[i + 1] - SC[i]) * 0.8).toFixed(2), title: SHOT_TITLES[i], sound: i === 8 ? 'le coup le plus fort' : i === 7 ? 'silence' : 'nappe douce, crayon', next: SHOT_KEYS[i + 1] || 'boucle' })),
  narration: VOICE.lines.map((l) => ({ id: l.id, t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;
